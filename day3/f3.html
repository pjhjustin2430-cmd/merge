<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 함수 f 를 만든다. (화살표 함수: (입력) => { 할 일 })
        // ({ a, b, z }) 는 "객체를 받아서 안에서 a, b, z 를 바로 꺼내 쓰겠다"는 뜻 (구조 분해)
        // 즉 f({a:10, b:1000, z:56}) 로 부르면 a=10, b=1000, z=56 이 된다.
        const f= (  { a, b ,z }  ) => {
            // 받은 값 3개를 다시 객체로 묶어서 콘솔에 보여 준다 → { a: 10, b: 1000, z: 56 }
            console.log({ a, b, z })
            // 계산해서 돌려준다(return): a×10×b + z = 10×10×1000 + 56 = 100056
            // (곱셈이 덧셈보다 먼저 계산된다)
            return a*10*b + z
        }
        // 함수에 넣어 줄 데이터. 키 이름(a, b, z)이 위 함수가 꺼내 쓰는 이름과 같아야 한다.
        let u = {"a": 10,"b":1000,"z":56}
        // f 에 u 를 통째로 넘겨서 계산 결과(100056)를 변수 a 에 저장한다.
        // (함수 안의 a 와는 별개의 변수다. 함수 안의 a 는 그 안에서만 쓰인다)
        let a= f(u)
        // 결과 확인 → 100056 이 콘솔에 나온다.
        console.log(a)
    </script>
</body>
</html>
